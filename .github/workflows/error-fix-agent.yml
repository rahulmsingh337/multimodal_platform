name: Error Detection and Auto Fix Agent

on:
  push:
    branches: ["master", "main", "Main"]
  workflow_dispatch:

jobs:
  detect-and-fix:
    name: Detect and Fix Errors
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          cd frontend && npm ci --silent
          pip install ruff --quiet

      - name: TypeScript check
        id: ts
        run: |
          cd frontend
          if npx tsc --noEmit 2>&1 | grep -q "error TS"; then
            echo "errors=true" >> $GITHUB_OUTPUT
          else
            echo "errors=false" >> $GITHUB_OUTPUT
            echo "TypeScript OK"
          fi

      - name: Next.js build check
        id: build
        env:
          NEXTAUTH_SECRET: ci-test-secret
          NEXT_PUBLIC_API_URL: https://multimodal-plat.vercel.app
        run: |
          cd frontend
          if npm run build 2>&1 | grep -qE "Failed to compile|Build error"; then
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "Build FAILED"
          else
            echo "failed=false" >> $GITHUB_OUTPUT
            echo "Build OK"
          fi

      - name: Python syntax check
        id: py
        run: |
          ERRORS=""
          for f in backend-vercel/api/index.py backend/main.py; do
            if [ -f "$f" ] && ! python3 -m py_compile "$f" 2>/dev/null; then
              ERRORS="$ERRORS $f"
            fi
          done
          if [ -n "$ERRORS" ]; then
            echo "errors=true" >> $GITHUB_OUTPUT
            echo "Python errors in:$ERRORS"
          else
            echo "errors=false" >> $GITHUB_OUTPUT
            echo "Python OK"
          fi

      - name: Auto fix Python
        id: py-fix
        run: |
          ruff check backend/ backend-vercel/ --fix 2>/dev/null || true
          ruff format backend/ backend-vercel/ 2>/dev/null || true
          if git diff --quiet; then
            echo "fixed=false" >> $GITHUB_OUTPUT
          else
            echo "fixed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit fixes
        if: steps.py-fix.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto-fix: ruff lint and format corrections [skip ci]"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Error Detection Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ steps.ts.outputs.errors == 'true' && 'Errors found' || 'OK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Next.js build | ${{ steps.build.outputs.failed == 'true' && 'FAILED' || 'Passing' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python syntax | ${{ steps.py.outputs.errors == 'true' && 'Errors' || 'OK' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Auto-fixes | ${{ steps.py-fix.outputs.fixed == 'true' && 'Applied' || 'None needed' }} |" >> $GITHUB_STEP_SUMMARY
