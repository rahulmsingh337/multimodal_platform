name: Vercel Deployment Monitor

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor All Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Wait for Vercel
        run: |
          echo "Waiting 120s for Vercel deployments..."
          sleep 120

      - name: Check Frontend
        id: fe
        run: |
          URL="https://multimodal-platform-eight.vercel.app"
          echo "Checking frontend: $URL"
          for i in 1 2 3 4 5; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -L "$URL" 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $HTTP"
            # Auth redirect (302/307) or 200 = site is UP
            if [[ "$HTTP" =~ ^(200|302|307|308)$ ]]; then
              echo "ok=true" >> $GITHUB_OUTPUT
              echo "msg=HTTP $HTTP (UP)" >> $GITHUB_OUTPUT
              break
            elif [[ "$HTTP" =~ ^5 ]]; then
              echo "Server error on attempt $i"
            fi
            sleep 15
          done
          if ! grep -q "ok=" $GITHUB_OUTPUT 2>/dev/null; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "msg=HTTP $HTTP (DOWN)" >> $GITHUB_OUTPUT
          fi

      - name: Check Backend
        id: be
        run: |
          URL="https://multimodal-plat.vercel.app"
          echo "Checking backend: $URL/health"
          for i in 1 2 3 4 5; do
            RESP=$(curl -s --max-time 20 "$URL/health" 2>/dev/null || echo "")
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL/health" 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $HTTP"
            if [ "$HTTP" = "200" ] && echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('status')=='ok' else 1)" 2>/dev/null; then
              DB=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('database','?'))" 2>/dev/null || echo "?")
              AI=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ai_image','?'))" 2>/dev/null || echo "?")
              echo "ok=true" >> $GITHUB_OUTPUT
              echo "msg=HTTP 200 — DB:$DB AI:$AI" >> $GITHUB_OUTPUT
              echo "db=$DB" >> $GITHUB_OUTPUT
              break
            fi
            sleep 15
          done
          if ! grep -q "ok=" $GITHUB_OUTPUT 2>/dev/null; then
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "msg=HTTP $HTTP — not responding correctly" >> $GITHUB_OUTPUT
            echo "db=none" >> $GITHUB_OUTPUT
          fi

      - name: Check all API endpoints
        id: api
        run: |
          BASE="https://multimodal-plat.vercel.app"
          RESULTS=""
          ALL_OK=true
          for EP in "/health" "/docs" "/api/v1/avatars" "/api/v1/jobs/" "/api/v1/storage/status"; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE$EP" 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              RESULTS="$RESULTS\n  PASS: $EP ($HTTP)"
            else
              RESULTS="$RESULTS\n  FAIL: $EP ($HTTP)"
              ALL_OK=false
            fi
          done
          echo -e "$RESULTS"
          echo "all_ok=$ALL_OK" >> $GITHUB_OUTPUT

      - name: Write job summary
        if: always()
        run: |
          FE_OK="${{ steps.fe.outputs.ok }}"
          BE_OK="${{ steps.be.outputs.ok }}"
          FE_MSG="${{ steps.fe.outputs.msg }}"
          BE_MSG="${{ steps.be.outputs.msg }}"
          DB="${{ steps.be.outputs.db }}"
          ALL_OK="${{ steps.api.outputs.all_ok }}"
          OVERALL=$([ "$FE_OK" = "true" ] && [ "$BE_OK" = "true" ] && echo "HEALTHY" || echo "DEGRADED")

          echo "## Vercel Monitor — $OVERALL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | $([ "$FE_OK" = "true" ] && echo "✅" || echo "❌") $FE_MSG |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | $([ "$BE_OK" = "true" ] && echo "✅" || echo "❌") $BE_MSG |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | $([ "$DB" = "vercel-postgres" ] && echo "✅ Vercel Postgres" || echo "⚠️ in-memory only") |" >> $GITHUB_STEP_SUMMARY
          echo "| All endpoints | $([ "$ALL_OK" = "true" ] && echo "✅ All passing" || echo "⚠️ Some failing") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DB" = "in-memory (free)" ] || [ "$DB" = "none" ]; then
            echo "> ⚠️ **Action needed:** Connect Vercel Postgres in Vercel Dashboard → Storage → Create → Connect to \`multimodal-plat\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issue if backend is down
        if: steps.be.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['deployment-failure'],
            });
            const title = 'Backend API down — ' + new Date().toISOString().slice(0,10);
            const body = [
              '## Backend Health Check Failed',
              '',
              'URL: https://multimodal-plat.vercel.app/health',
              'Status: ' + '${{ steps.be.outputs.msg }}',
              'Commit: `' + context.sha.slice(0,7) + '`',
              '',
              '### Checklist:',
              '- [ ] Check Vercel → multimodal-plat → latest deployment logs',
              '- [ ] Verify `backend-vercel/api/index.py` has no syntax errors',
              '- [ ] Check `requirements.txt` has compatible packages',
              '- [ ] Ensure `POSTGRES_URL` and `HF_TOKEN` are set in Vercel env vars',
            ].join('\n');
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deployment-failure', 'bug'],
              });
            }
            core.setFailed('Backend is down — issue created');
