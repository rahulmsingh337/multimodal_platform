name: 📡 Vercel Deployment Monitor

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  monitor-frontend:
    name: 🌐 Monitor Frontend
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait for Vercel build
        run: sleep 120

      - name: 🔍 Health check — Frontend
        id: check
        run: |
          URL="https://multimodal-platform-eight.vercel.app"
          echo "Checking $URL..."

          for i in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/resp.html -w "%{http_code}" --max-time 20 -L "$URL" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $HTTP"
            if [[ "$HTTP" =~ ^(200|307|302|308)$ ]]; then
              echo "status=healthy" >> $GITHUB_OUTPUT
              echo "http=$HTTP" >> $GITHUB_OUTPUT
              # Check for key page content
              if grep -q "MultiModal\|multimodal\|Next\|__NEXT" /tmp/resp.html 2>/dev/null; then
                echo "content=valid" >> $GITHUB_OUTPUT
              fi
              break
            fi
            sleep 15
          done
          [ -z "$(grep 'status=' $GITHUB_OUTPUT 2>/dev/null)" ] && echo "status=unhealthy" >> $GITHUB_OUTPUT

      - name: ✅ Frontend healthy
        if: steps.check.outputs.status == 'healthy'
        run: |
          echo "✅ Frontend is live and responding"
          echo "URL: https://multimodal-platform-eight.vercel.app"
          echo "HTTP: ${{ steps.check.outputs.http }}"

      - name: ❌ Frontend unhealthy
        if: steps.check.outputs.status != 'healthy'
        run: |
          echo "::error::Frontend health check failed"
          echo "URL: https://multimodal-platform-eight.vercel.app"
          exit 1

  monitor-backend:
    name: ⚙️ Monitor Backend API
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait for Vercel build
        run: sleep 120

      - name: 🔍 Health check — Backend
        id: check
        run: |
          URL="https://multimodal-plat.vercel.app"

          for i in 1 2 3 4 5; do
            RESP=$(curl -s --max-time 20 "$URL/health" 2>/dev/null || echo "ERROR")
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL/health" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $HTTP — $RESP"

            if echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if d.get('status')=='ok' else 1)" 2>/dev/null; then
              echo "status=healthy" >> $GITHUB_OUTPUT
              DB=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('database','unknown'))" 2>/dev/null)
              AI=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ai_image','unknown'))" 2>/dev/null)
              echo "db=$DB" >> $GITHUB_OUTPUT
              echo "ai=$AI" >> $GITHUB_OUTPUT
              break
            fi
            sleep 15
          done
          [ -z "$(grep 'status=' $GITHUB_OUTPUT 2>/dev/null)" ] && echo "status=unhealthy" >> $GITHUB_OUTPUT

      - name: 🔍 Check all API endpoints
        if: steps.check.outputs.status == 'healthy'
        run: |
          BASE="https://multimodal-plat.vercel.app"
          declare -A ENDPOINTS=(
            ["/health"]="200"
            ["/docs"]="200"
            ["/api/v1/avatars"]="200"
            ["/api/v1/jobs/"]="200"
            ["/api/v1/storage/status"]="200"
          )
          ALL_OK=true
          for EP in "${!ENDPOINTS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE$EP" 2>/dev/null)
            EXPECTED="${ENDPOINTS[$EP]}"
            if [ "$STATUS" = "$EXPECTED" ]; then
              echo "✅ $EP → $STATUS"
            else
              echo "❌ $EP → $STATUS (expected $EXPECTED)"
              ALL_OK=false
            fi
          done
          $ALL_OK && echo "All endpoints healthy" || { echo "::warning::Some endpoints failing"; }

      - name: ✅ Backend healthy
        if: steps.check.outputs.status == 'healthy'
        run: |
          echo "✅ Backend API is live"
          echo "Database: ${{ steps.check.outputs.db }}"
          echo "AI Image: ${{ steps.check.outputs.ai }}"

      - name: ❌ Backend unhealthy — create issue
        if: steps.check.outputs.status != 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Backend API down — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## 🚨 Backend Health Check Failed',
              '',
              `**Time:** ${new Date().toISOString()}`,
              `**URL:** https://multimodal-plat.vercel.app/health`,
              `**Branch:** \`${context.ref.replace('refs/heads/','')}\``,
              `**Commit:** \`${context.sha.slice(0,7)}\``,
              '',
              '### Immediate actions:',
              '1. Check Vercel dashboard → `multimodal-plat` → Deployments → latest build logs',
              '2. Check https://multimodal-plat.vercel.app/health manually',
              '3. If 500: check `backend-vercel/api/index.py` for syntax errors',
              '4. If build failed: check GitHub Actions → CI Agent logs',
              '',
              '### Common fixes:',
              '- **500 FUNCTION_INVOCATION_FAILED**: Python import error or missing dependency',
              '- **404**: Route not found — check `api/index.py` route definitions',
              '- **Build failed**: Dependency in `requirements.txt` incompatible with Python 3.12',
              '',
              '_This issue was automatically created by the Vercel Deployment Monitor._',
            ].join('\n');

            // Check if issue already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['deployment-failure'],
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deployment-failure', 'bug'],
              });
              console.log('Issue created');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `## 🔄 Still failing — ${new Date().toISOString()}\n\nCommit: \`${context.sha.slice(0,7)}\``,
              });
              console.log('Comment added to existing issue');
            }
            core.setFailed('Backend health check failed — issue created');

  notify-success:
    name: 🎉 Notify on success
    runs-on: ubuntu-latest
    needs: [monitor-frontend, monitor-backend]
    if: success()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            core.summary.addRaw([
              '## 🎉 Deployment Healthy',
              '',
              '| Service | URL | Status |',
              '|---------|-----|--------|',
              '| 🌐 Frontend | https://multimodal-platform-eight.vercel.app | ✅ Live |',
              '| ⚙️ Backend | https://multimodal-plat.vercel.app | ✅ Live |',
              '| 📖 API Docs | https://multimodal-plat.vercel.app/docs | ✅ Live |',
              '',
              `**Commit:** \`${context.sha.slice(0,7)}\` · **Branch:** \`${context.ref.replace('refs/heads/','')}\``,
            ].join('\n'));
            await core.summary.write();
