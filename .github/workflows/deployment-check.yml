name: 🚀 Deployment Health Check

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  wait-and-check:
    name: 🔍 Check Deployment Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ⏳ Wait for Vercel deployments
        run: |
          echo "Waiting 90s for Vercel to build..."
          sleep 90

      - name: 🔍 Check Frontend health
        id: frontend
        run: |
          FRONTEND_URL="https://multimodal-platform-eight.vercel.app"
          echo "Checking $FRONTEND_URL ..."
          
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$FRONTEND_URL" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "302" ]; then
              echo "frontend_status=✅ OK ($STATUS)" >> $GITHUB_OUTPUT
              echo "frontend_ok=true" >> $GITHUB_OUTPUT
              break
            fi
            sleep 10
          done
          
          if [ -z "$(grep 'frontend_ok' $GITHUB_OUTPUT)" ]; then
            echo "frontend_status=❌ FAILED ($STATUS)" >> $GITHUB_OUTPUT
            echo "frontend_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Check Backend health
        id: backend
        run: |
          BACKEND_URL="https://multimodal-plat.vercel.app"
          echo "Checking $BACKEND_URL/health ..."
          
          for i in 1 2 3; do
            RESPONSE=$(curl -s --max-time 15 "$BACKEND_URL/health" 2>/dev/null || echo "ERROR")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BACKEND_URL/health" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS — $RESPONSE"
            
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              DB=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('database','unknown'))" 2>/dev/null || echo "unknown")
              echo "backend_status=✅ OK — DB: $DB" >> $GITHUB_OUTPUT
              echo "backend_ok=true" >> $GITHUB_OUTPUT
              echo "backend_db=$DB" >> $GITHUB_OUTPUT
              break
            fi
            sleep 10
          done
          
          if [ -z "$(grep 'backend_ok' $GITHUB_OUTPUT)" ]; then
            echo "backend_status=❌ FAILED ($STATUS)" >> $GITHUB_OUTPUT
            echo "backend_ok=false" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Check API endpoints
        id: api
        run: |
          BASE="https://multimodal-plat.vercel.app"
          ENDPOINTS=("/api/v1/avatars" "/api/v1/jobs/" "/docs" "/api/v1/storage/status")
          ALL_OK=true
          RESULTS=""
          
          for EP in "${ENDPOINTS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE$EP" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              RESULTS="$RESULTS\n  ✅ $EP ($STATUS)"
            else
              RESULTS="$RESULTS\n  ❌ $EP ($STATUS)"
              ALL_OK=false
            fi
          done
          
          echo "api_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "api_ok=$ALL_OK" >> $GITHUB_OUTPUT

      - name: 📊 Post deployment report as commit status
        uses: actions/github-script@v7
        with:
          script: |
            const frontendOk = '${{ steps.frontend.outputs.frontend_ok }}' === 'true';
            const backendOk  = '${{ steps.backend.outputs.backend_ok }}'  === 'true';
            const apiOk      = '${{ steps.api.outputs.api_ok }}'          === 'true';
            const allOk      = frontendOk && backendOk;
            const state      = allOk ? 'success' : 'failure';
            const desc       = allOk ? 'All services healthy' : 'One or more services failed health check';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              sha:   context.sha,
              state,
              description: desc,
              context: 'deployment/health-check',
              target_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            });

            const emoji = allOk ? '✅' : '❌';
            const body = [
              `## ${emoji} Deployment Health Report`,
              '',
              '| Service | Status |',
              '|---------|--------|',
              `| 🌐 Frontend | ${{ steps.frontend.outputs.frontend_status }} |`,
              `| ⚙️ Backend API | ${{ steps.backend.outputs.backend_status }} |`,
              `| 📡 API Endpoints | ${{ steps.api.outputs.api_ok === 'true' && '✅ All passing' || '❌ Some failing' }} |`,
              '',
              '**API Endpoint Results:**',
              `${{ steps.api.outputs.api_results }}`,
              '',
              `**Commit:** \`${context.sha.slice(0,7)}\` · **Branch:** \`${context.ref.replace('refs/heads/','')}\``,
              '',
              allOk
                ? '> 🚀 Deployment is fully healthy and live.'
                : '> ⚠️ One or more services are down. Check Actions logs for details.',
              '',
              '| URL | Link |',
              '|-----|------|',
              '| Frontend | https://multimodal-platform-eight.vercel.app |',
              '| Backend | https://multimodal-plat.vercel.app |',
              '| API Docs | https://multimodal-plat.vercel.app/docs |',
            ].join('\n');

            // Post as check run summary
            core.summary.addRaw(body);
            await core.summary.write();

            if (!allOk) {
              core.setFailed('Deployment health check failed');
            }
